<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="appShell">
    <header class="appHeader">
      <div>
        <p class="eyebrow">Personal space</p>
        <h1 class="heading">Todo App</h1>
        <p class="subtitle">Keep small promises to yourself.</p>
      </div>
      <button class="modeIcon " type="button" aria-label="Toggle dark mode">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-moon-fill" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/>
        </svg>
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-sun-fill hide" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M8 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8M8 0a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 0m0 13a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-1 0v-2A.5.5 0 0 1 8 13m8-5a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2a.5.5 0 0 1 .5.5M3 8a.5.5 0 0 1-.5.5h-2a.5.5 0 0 1 0-1h2A.5.5 0 0 1 3 8m10.657-5.657a.5.5 0 0 1 0 .707l-1.414 1.415a.5.5 0 1 1-.707-.708l1.414-1.414a.5.5 0 0 1 .707 0m-9.193 9.193a.5.5 0 0 1 0 .707L3.05 13.657a.5.5 0 1 1-.707-.707l1.414-1.414a.5.5 0 0 1 .707 0m9.193 2.121a.5.5 0 0 1-.707 0l-1.414-1.414a.5.5 0 1 1-.707-.707l1.414 1.414a.5.5 0 0 1 0 .707M4.464 4.465a.5.5 0 0 1-.707 0L2.343 3.05a.5.5 0 1 1 .707-.707l1.414 1.414a.5.5 0 1 1 .707.708"/>
        </svg>
      </button>
    </header>

    <section class="taskComposer" aria-label="Add a task">
      <div class="textArea">
        <input type="text" class="input" id="lname" placeholder="What needs doing?" name="lname" autocomplete="off">
      </div>
      <button class="submit " type="button">Add task</button>
    </section>

    <section class="taskSection">
      <div class="sectionHeader">
        <h2>Your tasks</h2>
        <span class="taskCount" id="taskCount">0 tasks</span>
      </div>
      <div id="todoArea" class="todoArea">
       
        <p class="emptyState">Your list is clear. Add something small to get started.</p>
      </div>
    </section>

    <button class="delete  hide" id="delete" type="button">Delete selected</button>
  </main>
  <script type="module" src="script.js"></script>
</body>
</html>
